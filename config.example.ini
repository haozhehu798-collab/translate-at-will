# ============================================================
# 快捷翻译 · 配置模板
# 用法：把本文件复制一份并改名为 config.ini，再填入你自己的密钥。
# 注意：config.ini 含明文密钥，已被 .gitignore 忽略，切勿上传或外发。
#      首次运行若没有 config.ini，程序也会自动生成本文件同款空白配置。
# ============================================================

[settings]
# 三个全局快捷键：可填组合键（如 ctrl+alt+e），也可填单键（如 f1/f2/f3）
hotkey_translate = ctrl+alt+e
hotkey_ocr = ctrl+alt+s
hotkey_ai = ctrl+alt+a

# 百度翻译官方 API（可选）：留空则使用内置免费通道；填写后长句质量更好
baidu_appid =
baidu_key =

# AI 助手（OpenAI 兼容接口，可选）：不填则 AI 功能不可用，划词/OCR 不受影响
ai_preset = DeepSeek
ai_base_url = https://api.deepseek.com/v1
ai_key =
ai_model = deepseek-flash
# 专业领域（可选）：仅当问题确实与该领域相关时，AI 才会参考；留空即可
ai_domain =

# 常规开关
auto_copy = true
auto_startup = true
history = true
# 发音偏好：us（美音）/ uk（英音）
voice = us
# OCR 识别语言：en（英文）/ zh-Hans-CN（中文）
ocr_lang = en
